name: GitHub Metrics
on:
  schedule: [{ cron: "0 6 * * *" }]   # daily 06:00 UTC
  workflow_dispatch:                   # manual "Run workflow" button
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Analytics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          template: classic
          # base: "" -> no header/community/repositories stat rows, so NO zero counters
          # (followers, stars, sponsors are all 0 -> excluded entirely)
          base: ""
          config_timezone: Europe/London
          repositories_affiliations: owner, collaborator, organization_member
          # ===== centerpiece: full-year commit heatmap (isometric, includes private) =====
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # ===== languages: aggregate byte counts via API, includes private repos =====
          #       NO indepth -> never clones/reads private code. Only language % + names.
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          # ===== coding habits: when you commit (aggregate, no zero facts) =====
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_from: 200
          plugin_habits_days: 14
          # stargazers plugin REMOVED -> 0 stars, nothing to show
